none" stroke="#4c2a4a" stroke-width="1.3" marker-end="url(#solid)"/><text x="388" y="280" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#241a26">5. computeShape(kayıt, desenler)</text><path d="M 530 320 L 382 320" fill="none" stroke="#4c2a4a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="388" y="314" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">6. n, σ, σe, k, mMin, mMax, mMean (64 × 256 örneklem)</text><path d="M 380 354 L 658 354" fill="none" stroke="#4c2a4a" stroke-width="1.3" marker-end="url(#solid)"/><text x="388" y="348" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#241a26">7. candidates()</text><path d="M 660 388 L 382 388" fill="none" stroke="#4c2a4a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="388" y="382" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">8. aday atom sınıfları</text><path d="M 380 456 L 798 456" fill="none" stroke="#4c2a4a" stroke-width="1.3" marker-end="url(#solid)"/><text x="388" y="450" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#241a26">9. applicable(şekil)? ise estimateCost(atom, şekil, katsayılar)</text><path d="M 800 490 L 382 490" fill="none" stroke="#4c2a4a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="388" y="484" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">10. tahmini süre (ms)</text><rect x="330" y="416" width="550" height="106" fill="none" stroke="#9a8f9c" stroke-width="1.2"/><path d="M 330 416 L 378