1a26">15. process(kayıt)</text><path d="M 960 820 L 382 820" fill="none" stroke="#4c2a4a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="388" y="814" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">16. Sequence.Match …</text><rect x="160" y="746" width="870" height="106" fill="none" stroke="#9a8f9c" stroke-width="1.2"/><path d="M 160 746 L 208 746 L 208 758 L 200 766 L 160 766 Z" fill="#e9e0ea" stroke="#9a8f9c"/><text x="166" y="760.5" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#241a26">loop</text><text x="216" y="760.5" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">[her kayıt]</text><path d="M 200 868 L 62 868" fill="none" stroke="#4c2a4a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="68" y="862" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">17. stdout: JSONL; stderr: karar özeti</text><rect x="30" y="644" width="1020" height="256" fill="none" stroke="#9a8f9c" stroke-width="1.2"/><path d="M 30 644 L 70 644 L 70 656 L 62 664 L 30 664 Z" fill="#e9e0ea" stroke="#9a8f9c"/><text x="36" y="658.5" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#241a26">alt</text><text x="78" y="658.5" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">[explain]</text><path d="M 30 714 L 1050 714" stroke="#9a8f9c" stroke-width="1.1" stroke-dasharray="6 4"/><text x="38" y="729" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5a5160">[run]</text>
