# Talim Botu oyunu için makro ayarı.
# Benzetimde dene:  make benzetim AYAR=oyun/oyun_ayar.conf

platform = windows
# Oyunu bir yerde sun (ör. python -m http.server) ve adresini buraya yaz.
# Yerelde denemek için: python3 -m http.server 8000  ->  http://localhost:8000/oyun/
url = http://localhost:8000/oyun/
tuslar = a,s,d          # A sol kesik, S darbe, D sağ kesik
aralik_ms = 200
tekrar = 0              # 0 = sonsuz (cihazda sürekli döver)
baslangic_gecikme_ms = 2000
