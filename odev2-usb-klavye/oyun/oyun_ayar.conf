# Orman Farmı (.io) oyunu için makro ayarı — FARE tıklama botu.
# Benzetimde dene:  make benzetim AYAR=oyun/oyun_ayar.conf
#
# Gerçek kullanım: oyuncu karakteri kaynakların yanına götürür, oto-vuruşu
# ağaca/taşa ayarlar; cihaz takılınca sadece sol/sağ tık spamlar.

tarayici_ac = hayir        # oyuncu zaten oyunda; tarayıcı açma, sadece tıkla
eylem = fare               # asıl eylem: fare tıklaması
fare_dugmeleri = sol,sag   # sırayla sol ve sağ tık (sadece sol da olur)
aralik_ms = 150            # tıklar arası bekleme
tekrar = 0                 # 0 = sonsuz (cihazda sürekli farmlar)
