<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orman Farmı io</title>
<style>
  :root {
    --arka:#f3f4f6; --kart:#ffffff; --metin:#161922; --soluk:#6b7280; --cizgi:#e4e7ec;
    --odun:#b45309; --tas:#64748b; --xp:#2563eb; --yesil:#16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="light"]) {
      --arka:#0f1116; --kart:#1b1e25; --metin:#eceef3; --soluk:#99a1ae; --cizgi:#2b303a;
      --odun:#f59e0b; --tas:#94a3b8; --xp:#60a5fa; --yesil:#34d399;
    }
  }
  :root[data-tema="dark"] {
    --arka:#0f1116; --kart:#1b1e25; --metin:#eceef3; --soluk:#99a1ae; --cizgi:#2b303a;
    --odun:#f59e0b; --tas:#94a3b8; --xp:#60a5fa; --yesil:#34d399;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--arka); color:var(--metin); padding:16px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .kart { background:var(--kart); border:1px solid var(--cizgi); border-radius:18px;
    padding:20px; width:100%; max-width:460px; box-shadow:0 10px 34px rgba(0,0,0,.10); }
  h1 { font-size:20px; margin:0 0 2px; }
  .alt { color:var(--soluk); font-size:12.5px; margin:0 0 14px; line-height:1.5; }
  canvas { width:100%; height:auto; aspect-ratio:420/300; display:block; border-radius:12px;
    border:1px solid var(--cizgi); touch-action:none; cursor:crosshair; }
  .izgara { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 12px; }
  .kutu { background:var(--arka); border:1px solid var(--cizgi); border-radius:12px; padding:9px 4px; text-align:center; }
  .kutu b { display:block; font-size:21px; font-variant-numeric:tabular-nums; }
  .kutu small { color:var(--soluk); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; }
  .odunDeger { color:var(--odun); } .tasDeger { color:var(--tas); }
  .etiket { display:flex; justify-content:space-between; font-size:12px; color:var(--soluk); margin:2px 0; }
  .xpbar { height:10px; background:var(--cizgi); border-radius:99px; overflow:hidden; }
  .xpbar > span { display:block; height:100%; background:var(--xp); width:0%; transition:width .1s; }
  .durum { text-align:center; margin-top:12px; font-size:12px; color:var(--soluk); }
  kbd { background:var(--arka); border:1px solid var(--cizgi); border-bottom-width:2px; border-radius:6px;
    padding:1px 6px; font-family:inherit; font-size:12px; }
</style>
</head>
<body>
  <div class="kart">
    <h1>🌲 Orman Farmı <span style="color:var(--soluk);font-size:14px">.io</span></h1>
    <p class="alt">Oyuncu kaynakların yanında. Oto-hedef <b>en yakın kaynağa</b> kilitli;
      <b>sol/sağ fare tık</b> ile vurup <b style="color:var(--yesil)">odun</b> ve
      <b style="color:var(--tas)">taş</b> farmlanır. (Makro sadece tıklar; yürümeyi
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ile sen yaparsın.)</p>

    <canvas id="harita" width="420" height="300"></canvas>

    <div class="izgara">
      <div class="kutu"><b class="odunDeger" id="odun">0</b><small>🪵 Odun</small></div>
      <div class="kutu"><b class="tasDeger" id="tas">0</b><small>🪨 Taş</small></div>
      <div class="kutu"><b id="seviye">1</b><small>Seviye</small></div>
      <div class="kutu"><b id="tik">0</b><small>Tık</small></div>
    </div>

    <div class="etiket"><span>Sonraki seviye</span><span id="xpYazi">0 / 100</span></div>
    <div class="xpbar"><span id="xpBar"></span></div>

    <div class="durum">Toplam kaynak: <b id="toplam">0</b> · Hedef: <span id="hedefAd">—</span></div>
  </div>

<script>
(() => {
  "use strict";
  const G = { w: 420, h: 300 };
  const ADIM = 22, HASAR = 12, XP_BOLUM = 100, YENIDEN_MS = 1200, XP_ODUL = 15;
  const CAN = { agac: 24, tas: 36 };
  const AD = { agac: "Ağaç 🌳", tas: "Taş 🪨" };

  const cv = document.getElementById("harita");
  const cx = cv.getContext("2d");

  // Oyuncu kaynakların ortasında (insan oraya yürümüş varsayılır).
  const oyuncu = { x: G.w / 2, y: G.h / 2 };

  // Kaynakları ızgara olarak yerleştir.
  const kaynaklar = [];
  let sayac = 0;
  for (let y = 38; y <= 262; y += 56) {
    for (let x = 40; x <= 384; x += 58) {
      const tur = (sayac++ % 3 === 0) ? "tas" : "agac";
      kaynaklar.push({ x, y, tur, maxCan: CAN[tur], can: CAN[tur], yeniden: 0 });
    }
  }

  const durum = { tik: 0, odun: 0, tas: 0, toplam: 0, seviye: 1, xp: 0 };
  window.durum = durum;

  const vurusEfekt = [];
  const $ = (id) => document.getElementById(id);

  // Oto-hedef: oyuncuya en yakın, şu an toplanabilir (büyümeyen) kaynak.
  function hedefSec(now) {
    let en = -1, enUz = Infinity;
    for (let i = 0; i < kaynaklar.length; i++) {
      const k = kaynaklar[i];
      if (k.yeniden > now) continue;
      const dx = k.x - oyuncu.x, dy = k.y - oyuncu.y, uz = dx * dx + dy * dy;
      if (uz < enUz) { enUz = uz; en = i; }
    }
    return en;
  }

  function hudCiz() {
    $("odun").textContent = durum.odun;
    $("tas").textContent = durum.tas;
    $("seviye").textContent = durum.seviye;
    $("tik").textContent = durum.tik;
    $("toplam").textContent = durum.toplam;
    $("xpYazi").textContent = durum.xp + " / " + XP_BOLUM;
    $("xpBar").style.width = (100 * durum.xp / XP_BOLUM) + "%";
    const h = hedefSec(performance.now());
    $("hedefAd").textContent = h < 0 ? "—" : AD[kaynaklar[h].tur];
  }

  // Bir tık: oto-hedeflenen kaynağa vur; bitti ise topla.
  function tikla() {
    durum.tik++;
    const now = performance.now();
    const h = hedefSec(now);
    if (h >= 0) {
      const k = kaynaklar[h];
      k.can -= HASAR;
      vurusEfekt.push({ x: k.x, y: k.y, bitis: now + 110 });
      if (k.can <= 0) {
        if (k.tur === "agac") durum.odun++; else durum.tas++;
        durum.toplam++;
        durum.xp += XP_ODUL;
        while (durum.xp >= XP_BOLUM) { durum.xp -= XP_BOLUM; durum.seviye++; }
        k.can = k.maxCan;
        k.yeniden = now + YENIDEN_MS;   // bir süre sonra yeniden büyür
      }
    }
    hudCiz();
  }

  // Sol ve sağ tık (ikisi de vurur). Sağ tık menüsünü engelle.
  window.addEventListener("mousedown", tikla);
  window.addEventListener("contextmenu", (e) => e.preventDefault());

  // İnsan için yürüme (makro bunu kullanmaz).
  window.addEventListener("keydown", (e) => {
    const t = e.key.toLowerCase();
    if (t === "w") oyuncu.y = Math.max(12, oyuncu.y - ADIM);
    else if (t === "s") oyuncu.y = Math.min(G.h - 12, oyuncu.y + ADIM);
    else if (t === "a") oyuncu.x = Math.max(12, oyuncu.x - ADIM);
    else if (t === "d") oyuncu.x = Math.min(G.w - 12, oyuncu.x + ADIM);
    else return;
    e.preventDefault();
    hudCiz();
  });

  function cizKare(now) {
    // Zemin + ızgara
    cx.fillStyle = "#5c8a4a";
    cx.fillRect(0, 0, G.w, G.h);
    cx.strokeStyle = "rgba(255,255,255,.06)";
    for (let x = 0; x <= G.w; x += 30) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, G.h); cx.stroke(); }
    for (let y = 0; y <= G.h; y += 30) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(G.w, y); cx.stroke(); }

    const hedef = hedefSec(now);

    // Hedef işaretçisi (nişan çizgisi)
    if (hedef >= 0) {
      const k = kaynaklar[hedef];
      cx.strokeStyle = "rgba(255,255,255,.5)"; cx.lineWidth = 1.5;
      cx.beginPath(); cx.moveTo(oyuncu.x, oyuncu.y); cx.lineTo(k.x, k.y); cx.stroke();
      cx.strokeStyle = "#fde047"; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(k.x, k.y, 18, 0, Math.PI * 2); cx.stroke();
    }

    // Kaynaklar
    cx.textAlign = "center"; cx.textBaseline = "middle";
    for (const k of kaynaklar) {
      const buyuyor = k.yeniden > now;
      cx.globalAlpha = buyuyor ? 0.28 : 1;
      cx.fillStyle = k.tur === "agac" ? "#2f6b34" : "#6b7280";
      cx.beginPath(); cx.arc(k.x, k.y, 13, 0, Math.PI * 2); cx.fill();
      cx.font = "17px system-ui,'Segoe UI Emoji',sans-serif";
      cx.fillText(k.tur === "agac" ? "🌳" : "🪨", k.x, k.y + 1);
      if (!buyuyor && k.can < k.maxCan) {
        cx.globalAlpha = 1;
        cx.fillStyle = "rgba(0,0,0,.35)"; cx.fillRect(k.x - 14, k.y - 22, 28, 4);
        cx.fillStyle = "#ef4444"; cx.fillRect(k.x - 14, k.y - 22, 28 * k.can / k.maxCan, 4);
      }
      cx.globalAlpha = 1;
    }

    // Vuruş efektleri
    for (let i = vurusEfekt.length - 1; i >= 0; i--) {
      const v = vurusEfekt[i];
      if (v.bitis < now) { vurusEfekt.splice(i, 1); continue; }
      cx.strokeStyle = "rgba(255,255,255,.85)"; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(v.x, v.y, 20, 0, Math.PI * 2); cx.stroke();
    }

    // Oyuncu
    cx.fillStyle = "#f59e0b";
    cx.beginPath(); cx.arc(oyuncu.x, oyuncu.y, 11, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = "#1b1e25"; cx.lineWidth = 2; cx.stroke();

    requestAnimationFrame(cizKare);
  }

  hudCiz();
  requestAnimationFrame(cizKare);
})();
</script>
</body>
</html>
