name: Testler

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s testler -v
      - name: Ölçüm (denetim kuralları, temel çizgiyle)
        run: python olcum/denetim_olcumu.py
