# Vize projesini (Kod Bilimi Atölyesi: site, atölye, sunum, rapor) GitHub Pages'e yayınlar:
#   https://baki-b.github.io/YZM327-Odevler/
# Agora'nın tarayıcı sürümü artık burada yayınlanmıyor (yerine vize sitesi geldi).
# Bir kez: depo Settings > Pages > Build and deployment > Source: "GitHub Actions" seçilmelidir (zaten seçili).
name: GitHub Pages (vize sitesi)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testler (başarısızsa yayımlanmaz)
        working-directory: vize
        run: npm test
      - name: Siteyi hazırla (vize/ klasörü olduğu gibi; kökteki index.html siteye yönlendirir)
        run: |
          mkdir _site
          cp -r vize/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
