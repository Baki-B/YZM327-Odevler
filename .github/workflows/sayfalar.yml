# Agora'nın tarayıcı sürümünü GitHub Pages'e yayınlar: https://baki-b.github.io/YZM327-Odevler/
# Bir kez: depo Settings > Pages > Build and deployment > Source: "GitHub Actions" seçilmelidir.
name: GitHub Pages (tarayıcı sürümü)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testler (başarısızsa yayımlanmaz)
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s testler
      - name: Siteyi derle
        run: python tarayici/derle.py --cikti _site
      - name: Android uygulamasını siteye ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android -p Agora.apk -D _site --clobber --repo "$GITHUB_REPOSITORY" || echo "Henüz APK yok"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
