# Android uygulamasını (Capacitor) derler ve APK'yı "Agora Android" sürümüne ekler:
# https://github.com/Baki-B/YZM327-Odevler/releases/latest
name: Android uygulaması

on:
  push:
    branches: [main]
  pull_request:
    paths: ["mobil/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor projesini hazırla
        working-directory: mobil
        run: |
          npm ci
          npx cap sync android
      - name: APK derle
        working-directory: mobil/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Agora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Agora-apk
          path: Agora.apk
      - name: Sürüme ekle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Agora Android" \
            --notes "Agora'nın Android uygulaması. Telefonda Agora.apk dosyasını indirip aç; bilinmeyen kaynaklardan kuruluma izin vermen istenebilir. Uygulama https://baki-b.github.io/YZM327-Odevler/ adresindeki forumu açar." --latest
          gh release upload android Agora.apk --clobber
