<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agora</title>
  <style>
    :root { --t50: #f6f4ef; --t100: #ebe7df; --g900: #2c2a27; --y600: #4a6642; --y700: #3a5234; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: var(--t100); color: var(--g900); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 1.35rem; margin: 16px 0 6px; }
    p { margin: 0 0 18px; color: color-mix(in srgb, var(--g900) 65%, transparent); }
    button { background: var(--y600); color: var(--t50); border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 700; }
    button:active { background: var(--y700); }
  </style>
</head>
<body>
  <main>
    <img src="ikon.png" alt="">
    <h1>Bağlantı kurulamadı</h1>
    <p>İnternet bağlantını kontrol edip tekrar dene. Forum kendi bilgisayarında çalışıyorsa sunucunun açık ve telefonun aynı Wi-Fi ağında olduğundan emin ol.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Tekrar dene</button>
  </main>
</body>
</html>
